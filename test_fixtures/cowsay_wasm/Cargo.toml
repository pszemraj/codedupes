[package]
name = "cowsay-dupe-fixture"
version = "0.1.0"
edition = "2021"
description = "A real Rust/WebAssembly cowsay project with intentional code-clone fixtures"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cowsay-fixture"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
