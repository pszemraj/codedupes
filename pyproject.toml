[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "codedupes"
dynamic = ["version"]
description = "Detect duplicate/unused Python code via AST analysis and multi-model semantic embeddings"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "sentence-transformers>=5.6,<6",
    "transformers>=5.1,<6",
    "torch>=2.13.0,<3",
    "numpy>=2.1.0,<3",
    "packaging>=24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/pszemraj/codedupes.git"
Repository = "https://github.com/pszemraj/codedupes.git"

[project.scripts]
codedupes = "codedupes.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/codedupes"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/codedupes",
    "tests",
    "test_fixtures",
    "scripts",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/codedupes/_version.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_fixtures/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "network: tests that download remote model assets",
    "gpu: tests that require CUDA and GPU execution",
    "mps: tests that require Apple Silicon MPS execution",
]
